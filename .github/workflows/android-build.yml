name: Android build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      IPTV_SIGNING_KEYSTORE_BASE64: ${{ secrets.IPTV_SIGNING_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare stable signing key
        if: ${{ env.IPTV_SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$IPTV_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iptv-monitor-signing.jks"
      - name: Build debug APK
        env:
          IPTV_SIGNING_STORE_FILE: ${{ secrets.IPTV_SIGNING_KEYSTORE_BASE64 != '' && format('{0}/iptv-monitor-signing.jks', runner.temp) || '' }}
          IPTV_SIGNING_STORE_PASSWORD: ${{ secrets.IPTV_SIGNING_STORE_PASSWORD }}
          IPTV_SIGNING_KEY_ALIAS: ${{ secrets.IPTV_SIGNING_KEY_ALIAS }}
          IPTV_SIGNING_KEY_PASSWORD: ${{ secrets.IPTV_SIGNING_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-monitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
